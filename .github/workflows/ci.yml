name: ci

on:
  push:
  pull_request:

jobs:
  # Everything that needs neither Unreal nor a compiler. Under 30 seconds.
  # This is the gate that catches most agent mistakes.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # check_conventions inspects commit history (rule 16)
          lfs: false              # no need for Content/ here
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema

      - name: Enforced conventions (sim purity, magic numbers, likeness)
        run: python3 tools/check_conventions.py

      - name: Level and tuning data
        run: python3 tools/validate_data.py

      - name: Task graph (frontmatter, cycles, ownership conflicts)
        run: python3 tools/tasks.py validate

      - name: Documentation links
        run: python3 tools/check_links.py

      - name: The convention checkers' own tests
        run: python3 tools/test_conventions.py

      - name: Blueprints are glue only (rule 18)
        run: python3 tools/check_blueprints.py

  # The gameplay layer. Builds and tests WITHOUT Unreal — this is the point of the
  # SteeplejackSim module split (ADR-0004). Should stay under two minutes.
  sim:
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++-13 lcov

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=g++-13

      - name: Build
        run: cmake --build build -j

      - name: Unit and property tests
        run: build/sim_tests

      - name: Level, replay and determinism gates
        run: make test-levels test-replay test-determinism

      - name: Sim step budget (< 0.5 ms)
        run: make test-perf

      - name: Coverage gate (>= 90% of SteeplejackSim)
        run: python3 tools/coverage.py

  # The presentation layer. Requires a self-hosted runner with Unreal 5.5 installed;
  # GitHub-hosted runners cannot do this. Enabled by CORE-002.
  game:
    runs-on: [self-hosted, unreal]
    needs: sim
    if: false          # TODO(CORE-002): enable once a self-hosted runner exists
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - name: Build editor target
        run: make build-game
      - name: UE automation tests
        run: make test-automation
