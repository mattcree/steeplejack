name: ci

on:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.4.1"

jobs:
  # Everything that does not need the engine. Must stay under 60 seconds —
  # this is the gate that catches most agent mistakes.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # check_conventions inspects commit history (rule 16)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema gdtoolkit==4.*

      - name: Enforced conventions (sim purity, magic numbers, likeness)
        run: python3 tools/check_conventions.py

      - name: Level and tuning data
        run: python3 tools/validate_data.py

      - name: Task graph (frontmatter, cycles, ownership conflicts)
        run: python3 tools/tasks.py validate

      - name: Documentation links
        run: python3 tools/check_links.py

      - name: GDScript format and lint
        run: |
          if [ -n "$(find sim game tests -name '*.gd' 2>/dev/null)" ]; then
            gdformat --check sim game tests
            gdlint sim game tests
          else
            echo "no GDScript yet — skipping"
          fi

  # Enabled by CORE-002. Remove continue-on-error in that task, not before.
  engine:
    runs-on: ubuntu-latest
    needs: fast
    continue-on-error: true       # TODO(CORE-002): remove
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Import assets
        run: godot --path . --headless --import || true

      - name: Unit and property tests
        run: make test-unit

      - name: Level validation (schema, beat rule, reachability)
        run: make test-levels

      - name: Replay regression
        run: make test-replay

      - name: Determinism
        run: make test-determinism
