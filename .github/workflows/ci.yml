name: ci

on:
  push:
  pull_request:

jobs:
  # Everything that needs neither an engine nor a compiler. Under 30 seconds.
  # This is the gate that catches most agent mistakes.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # check_conventions inspects commit history (rule 16)
          lfs: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema

      - name: Enforced conventions (sim purity, magic numbers, likeness)
        run: python3 tools/check_conventions.py

      - name: Level and tuning data
        run: python3 tools/validate_data.py

      - name: Task graph (frontmatter, cycles, ownership conflicts)
        run: python3 tools/tasks.py validate

      - name: Documentation links
        run: python3 tools/check_links.py

      - name: Binary assets — LFS coverage, pointer integrity and size (CORE-010)
        run: python3 tools/check_content_size.py

      - name: The convention checkers' own tests
        run: python3 tools/test_conventions.py
      - name: The asset gate's own tests
        run: python3 tools/test_content_size.py

  # The gameplay layer. Builds and tests with no engine installed — the Godot game links the
  # same library. Should stay under two minutes.
  sim:
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++-13 lcov

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=g++-13

      - name: Build
        run: cmake --build build -j

      - name: Unit and property tests
        run: build/sim_tests

      - name: Level, replay-format and determinism gates
        run: make test-levels test-replay-format test-determinism

      - name: Sim step budget (< 0.5 ms)
        run: make test-perf

      - name: Coverage gate (>= 90% of SteeplejackSim)
        run: python3 tools/coverage.py

  # The game itself, headless: every verb driven and asserted on, a bot that climbs the Grey Box to
  # the top, and that climb compared with its recording. Godot is one binary and runs headless, so
  # a GitHub-hosted runner is enough. The version must match the one godot-cpp's API is built for.
  godot:
    runs-on: ubuntu-latest
    needs: sim
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++-13 unzip xvfb
      - name: Install Godot
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mkdir -p ~/.local/bin
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/.local/bin/godot
          ~/.local/bin/godot --version
      - name: Every verb, and the climb to the top
        run: make godot-test
      - name: The climb matches its recording
        run: make replay-regression

